<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Staff Rice Store: Admin</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Cpath d=%27M8 9h16l2 4-1 13a3 3 0 0 1-3 3H10a3 3 0 0 1-3-3L6 13z%27 fill=%27%23245a33%27/%3E%3Cpath d=%27M10 6c1.5 2 3.5 2 6 0 2.5 2 4.5 2 6 0l1 3H9z%27 fill=%27%23b8893f%27/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>

<header class="topbar">
  <div class="topbar-in">
    <a class="wordmark" href="/admin">Store admin</a>
    <a class="link-btn" href="/">View store</a>
    <button class="link-btn" id="logout" type="button" hidden>Sign out</button>
  </div>
</header>

<section class="login" id="login">
  <h1>Admin sign-in</h1>
  <form class="form" id="loginForm" novalidate>
    <div class="field"><label for="pw">Admin password</label><input id="pw" type="password" autocomplete="current-password" required></div>
    <button class="btn" type="submit">Sign in</button>
    <p class="err" id="loginErr" role="alert"></p>
  </form>
</section>

<main class="admin-wrap" id="app" hidden>
  <div class="tabs" id="tabs" role="group" aria-label="Sections"></div>
  <p class="err" id="appErr" role="alert"></p>
  <div id="panel"></div>
</main>

<div class="toast" id="toast" role="status"></div>
<script src="/js/admin.js"></script>
</body>
</html>
